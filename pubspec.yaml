name: pantrypal_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.7
  http: ^1.2.0
  intl: ^0.19.0
  google_generative_ai: ^0.2.2
  mobile_scanner: ^3.5.7
  shared_preferences: ^2.2.1
  firebase_core: ^2.24.0
  firebase_auth: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/pantrypallogo.png

  fonts:
    - family: IndieFlower
      fonts:
        - asset: fonts/IndieFlower-Regular.ttf
